# ld65 config for Light Cycle (C64)
#
# One .prg loading at $0801. Code and data stay below $4000: VIC bank 1
# ($4000-$7FFF) is reserved for video memory (see docs/porting.md).

MEMORY {
    ZP:      file = "",  start = $0002, size = $00FE;   # all of it: BASIC/KERNAL are banked out
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:    file = %O, start = $0801, size = $4000 - $0801, fill = no;
    HISCORE: file = "",  start = $C000, size = $0100;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp,  optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw,  optional = yes;
    BSS:      load = MAIN,     type = bss, optional = yes, define = yes;
    HISCORE:  load = HISCORE,  type = bss, optional = yes;
}
